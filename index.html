<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitaire</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Solitaire</h1>
            <button class="new-game-btn">New Game</button>
        </div>

        <div class="game-board">
            <div class="top-section">
                <div class="stock-waste">
                    <div class="pile stock" id="stock">
                        <div class="card-back"></div>
                    </div>
                    <div class="pile waste" id="waste"></div>
                </div>
                <div class="foundations" id="foundations">
                    <div class="pile foundation" id="foundation-0" data-suit="hearts"></div>
                    <div class="pile foundation" id="foundation-1" data-suit="diamonds"></div>
                    <div class="pile foundation" id="foundation-2" data-suit="clubs"></div>
                    <div class="pile foundation" id="foundation-3" data-suit="spades"></div>
                </div>
            </div>

            <div class="tableaus" id="tableaus">
                <div class="pile tableau" id="tableau-0"></div>
                <div class="pile tableau" id="tableau-1"></div>
                <div class="pile tableau" id="tableau-2"></div>
                <div class="pile tableau" id="tableau-3"></div>
                <div class="pile tableau" id="tableau-4"></div>
                <div class="pile tableau" id="tableau-5"></div>
                <div class="pile tableau" id="tableau-6"></div>
            </div>
        </div>
    </div>

    <script type="module" src="index.js"></script>

</body>
</html>
